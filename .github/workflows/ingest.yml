name: Daily Digest Ingest

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 06:30 IST every morning
  workflow_dispatch:        # manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the DB back

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python -m scripts.run all

      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f daily-digest.db
          # items.json is regenerated by scripts.run; add it only if present so a
          # missing/failed export never aborts the commit with exit 128.
          [ -f app/frontend/public/items.json ] && git add -f app/frontend/public/items.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: daily digest ingest $(date -u '+%Y-%m-%d')"
          git push origin HEAD
