<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F0E6CE" />
<meta name="description" content="Your personalized AI/tech digest — news, papers, videos and repos, ranked for you." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/logo-mark.png" />
<link rel="apple-touch-icon" href="assets/logo-mark.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Daily Digest" />
<title>Daily Digest</title>
<link rel="stylesheet" href="app.css?v=11" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

<script src="./ds-base.js?v=11"></script>
</head>
<body>
  <div id="root"></div>
  <script src="share.js?v=11"></script>
  <script src="saved.js?v=11"></script>
  <script src="tts.js?v=11"></script>
  <script src="data.js?v=11"></script>
  <script type="text/babel" src="cards.jsx?v=11"></script>
  <script type="text/babel" src="reading.jsx?v=11"></script>
  <script type="text/babel" src="channels.jsx?v=11"></script>
  <script type="text/babel" src="App.jsx?v=11"></script>
  <script>
    // Offline support. The SW is network-first (see sw.js), so the daily refresh
    // always wins when online; bump the ?v= asset version on each deploy to force
    // fresh code through any intermediate HTTP cache.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
