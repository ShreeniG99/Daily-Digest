<!-- @dsCard group="Brand" viewport="700x200" name="Logomark + usage" subtitle="Owl mark for app headers; keep clearspace, set on cream" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); display: flex; gap: 28px; align-items: center; }
  .mark { background: var(--surface-page); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); padding: 16px; }
  .mark img { width: 120px; height: auto; }
  .note h4 { font-size: var(--text-md); margin-bottom: 8px; }
  .note ul { margin: 0; padding-left: 18px; color: var(--text-secondary); font-family: var(--font-serif); font-size: var(--text-sm); line-height: 1.7; }
  .lockup { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .lockup img { width: 34px; }
  .wm { font-family: var(--font-serif); font-weight: 700; font-size: var(--text-lg); color: var(--text-primary); letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="mark"><img src="../assets/logo-mark.png" alt="Daily Digest owl mark" /></div>
  <div class="note">
    <h4>Logomark</h4>
    <ul>
      <li>Use for app header, favicon, PWA icon.</li>
      <li>Always on a cream/beige ground — never on saturated color.</li>
      <li>Pair with the serif wordmark for headers:</li>
    </ul>
    <div class="lockup"><img src="../assets/logo-mark.png" alt="" /><span class="wm">Daily Digest</span></div>
  </div>
</body>
</html>
