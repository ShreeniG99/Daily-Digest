<!-- @dsCard group="Colors" viewport="700x160" name="Night theme" subtitle="Warm 'reading lamp' dark sepia — espresso ground, cream ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 0; }
  .stage { padding: 20px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .sw { flex: 1 1 0; min-width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .name { font-family: var(--font-sans); font-size: var(--text-xs); font-weight: 600; color: var(--text-primary); margin-top: 7px; }
  .tag { font-family: var(--font-sans); font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-link); margin-bottom: 12px; }
</style>
</head>
<body data-theme="night">
  <div class="stage">
    <div class="tag">data-theme="night"</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="name">Page</div></div>
      <div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="name">Card</div></div>
      <div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="name">Raised</div></div>
      <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="name">Accent</div></div>
      <div class="sw"><div class="chip" style="background:var(--accent-gold)"></div><div class="name">Gold</div></div>
      <div class="sw"><div class="chip" style="background:var(--text-primary)"></div><div class="name">Ink</div></div>
    </div>
  </div>
</body>
</html>
