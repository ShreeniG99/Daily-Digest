<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces — cream / beige" subtitle="Page, card, raised, sunken — the warm reading ground" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 110px; }
  .chip { height: 76px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .name { font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); margin-top: 8px; }
  .val { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="name">Page</div><div class="val">--surface-page</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="name">Card</div><div class="val">--surface-card</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="name">Raised</div><div class="val">--surface-raised</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="name">Sunken</div><div class="val">--surface-sunken</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-active)"></div><div class="name">Active</div><div class="val">--surface-active</div></div>
  </div>
</body>
</html>
