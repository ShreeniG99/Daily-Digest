<!-- @dsCard group="Type" viewport="700x150" name="UI text & metadata" subtitle="Eyebrow, meta line, tabular score — all sans" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  .col .role { font-size: var(--text-2xs); color: var(--text-muted); margin-top: 6px; font-family: var(--font-mono); }
  .meta { font-size: var(--text-sm); color: var(--text-secondary); font-weight: 500; }
  .score { font-size: var(--text-xl); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ochre); }
</style>
</head>
<body>
  <div class="col"><span class="dd-eyebrow">Trending in AI</span><div class="role">.dd-eyebrow</div></div>
  <div class="col"><span class="meta">Hacker News · 4h ago · @karpathy</span><div class="role">meta line · sm/500</div></div>
  <div class="col"><span class="score dd-tnum">9.4</span><div class="role">.dd-tnum score</div></div>
</body>
</html>
