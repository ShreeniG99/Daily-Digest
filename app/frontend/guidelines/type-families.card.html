<!-- @dsCard group="Type" viewport="700x210" name="Families — Inter / Merriweather" subtitle="Sans headlines scan fast; serif body reads long" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .role { font-family: var(--font-sans); font-size: var(--text-2xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .big-sans { font-family: var(--font-sans); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -0.02em; color: var(--text-primary); }
  .big-serif { font-family: var(--font-serif); font-weight: 400; font-size: 40px; line-height: 1; color: var(--text-primary); }
  .meta { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); margin-top: 12px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="role">Headlines · Sans</div>
      <div class="big-sans">Inter</div>
      <div class="meta">400 · 500 · 600 · 700</div>
    </div>
    <div>
      <div class="role">Body · Serif</div>
      <div class="big-serif">Merriweather</div>
      <div class="meta">300 · 400 · 400i · 700</div>
    </div>
  </div>
</body>
</html>
