<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & elevation" subtitle="Editorial corner radii and soft warm-tinted shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-sans); display: flex; gap: 26px; flex-wrap: wrap; align-items: center; }
  .box { width: 96px; height: 72px; background: var(--surface-card); border: 1px solid var(--border-hairline); display: flex; align-items: flex-end; justify-content: center; }
  .v { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-muted); padding-bottom: 6px; }
  .grp { display: flex; gap: 16px; }
  .lbl { font-size: var(--text-2xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); width: 100%; }
  .col { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
  <div class="col">
    <span class="lbl">Radius</span>
    <div class="grp">
      <div class="box" style="border-radius:var(--radius-sm)"><span class="v">sm 6</span></div>
      <div class="box" style="border-radius:var(--radius-md)"><span class="v">md 10</span></div>
      <div class="box" style="border-radius:var(--radius-lg)"><span class="v">lg 14</span></div>
    </div>
  </div>
  <div class="col">
    <span class="lbl">Elevation</span>
    <div class="grp">
      <div class="box" style="border:none;box-shadow:var(--shadow-sm);border-radius:var(--radius-md)"><span class="v">sm</span></div>
      <div class="box" style="border:none;box-shadow:var(--shadow-md);border-radius:var(--radius-md)"><span class="v">md</span></div>
      <div class="box" style="border:none;box-shadow:var(--shadow-lg);border-radius:var(--radius-md)"><span class="v">lg</span></div>
    </div>
  </div>
</body>
</html>
