<!-- @dsCard group="Colors" viewport="700x180" name="Ink — brown text ramp" subtitle="Dark-brown ink from primary to disabled" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 100px; }
  .chip { height: 64px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; }
  .chip span { font-family: var(--font-sans); font-weight: 700; font-size: var(--text-sm); }
  .name { font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); margin-top: 8px; }
  .val { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--brown-900)"><span style="color:var(--cream-50)">Aa</span></div><div class="name">Primary</div><div class="val">--text-primary</div></div>
    <div class="sw"><div class="chip" style="background:var(--brown-700)"><span style="color:var(--cream-50)">Aa</span></div><div class="name">Secondary</div><div class="val">--text-secondary</div></div>
    <div class="sw"><div class="chip" style="background:var(--brown-600)"><span style="color:var(--cream-50)">Aa</span></div><div class="name">Muted</div><div class="val">--text-muted</div></div>
    <div class="sw"><div class="chip" style="background:var(--brown-500)"><span style="color:var(--cream-50)">Aa</span></div><div class="name">Faint</div><div class="val">--text-faint</div></div>
    <div class="sw"><div class="chip" style="background:var(--brown-400)"><span style="color:var(--cream-50)">Aa</span></div><div class="name">Disabled</div><div class="val">--text-disabled</div></div>
  </div>
</body>
</html>
